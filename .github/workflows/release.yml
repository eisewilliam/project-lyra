name: release

# Builds installers and signed update bundles into a draft release, then
# publishes it once every build has succeeded. A tag must match the app
# version in Cargo.toml (v0.2.0 for version 0.2.0). See docs/RELEASING.md.

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: Existing tag to build, for example v0.2.0
                required: true
                type: string
            publish:
                description: Publish when every build succeeds (off keeps a draft to inspect)
                type: boolean
                default: false

permissions:
    contents: write

concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

env:
    APP_DIR: apps/desktop-tauri
    TAG: ${{ inputs.tag || github.ref_name }}

jobs:
    prepare:
        name: Prepare draft release
        runs-on: ubuntu-latest
        outputs:
            release-id: ${{ steps.release.outputs.id }}
        steps:
            - name: Check out the tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.TAG }}

            - name: Check the tag matches the app version
              id: version
              run: |
                  version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
                  if [ "v$version" != "$TAG" ]; then
                      echo "::error::Tag $TAG does not match version $version in Cargo.toml. Tag v$version instead, or bump the version first."
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - name: Check the updater public key is set
              run: |
                  if grep -q UPDATER_PUBLIC_KEY_NOT_SET "$APP_DIR/src-tauri/tauri.conf.json"; then
                      echo "::error::plugins.updater.pubkey in tauri.conf.json is still the placeholder. See docs/RELEASING.md."
                      exit 1
                  fi

            - name: Create or reuse the draft release
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  existing=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
                      --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")
                  if [ -n "$existing" ]; then
                      read -r id draft <<< "$existing"
                      if [ "$draft" != "true" ]; then
                          echo "::error::Release $TAG is already published. Bump the version for a new release."
                          exit 1
                      fi
                  else
                      # A hyphen marks a pre-release (v0.2.0-beta.1); updates skip those.
                      prerelease=false
                      case "$VERSION" in *-*) prerelease=true ;; esac
                      id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                          -f tag_name="$TAG" \
                          -f name="Lyra $VERSION" \
                          -F draft=true \
                          -F prerelease="$prerelease" \
                          -F generate_release_notes=true \
                          --jq .id)
                  fi
                  echo "id=$id" >> "$GITHUB_OUTPUT"

    build:
        name: ${{ matrix.name }}
        needs: prepare
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS (universal)
                      platform: macos-latest
                      rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
                      args: --target universal-apple-darwin
                    - name: Windows x64
                      platform: windows-latest
                      rust-targets: ""
                      args: ""
                    - name: Linux x64
                      platform: ubuntu-22.04
                      rust-targets: ""
                      args: ""

        steps:
            - name: Check out the tag
              uses: actions/checkout@v4
              with:
                  ref: ${{ env.TAG }}

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      build-essential \
                      curl \
                      wget \
                      file \
                      libxdo-dev \
                      libssl-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libdbus-1-dev \
                      pkg-config \
                      patchelf

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust-targets }}

            - name: Restore Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  key: release-${{ matrix.platform }}

            - name: Install frontend dependencies
              working-directory: ${{ env.APP_DIR }}
              run: pnpm install --frozen-lockfile

            - name: Check updater signing credentials
              shell: bash
              working-directory: ${{ env.APP_DIR }}
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  check_file="$RUNNER_TEMP/lyra-updater-check.txt"
                  printf 'Lyra updater signing check\n' > "$check_file"
                  pnpm tauri signer sign "$check_file" --app-version "${TAG#v}"

            # Internal prereleases can use ad-hoc signing without Apple secrets.
            # Stable releases and partially configured accounts still fail closed.
            - name: Prepare macOS signing and notarization
              id: macos-signing
              if: runner.os == 'macOS'
              env:
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
              run: bash .github/scripts/prepare-macos-signing.sh

            - name: Build, sign and upload
              if: runner.os != 'macOS' || steps.macos-signing.outputs.unsigned != 'true'
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # Signs update bundles; the app checks them against the
                  # public key in tauri.conf.json.
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
              with:
                  projectPath: ${{ env.APP_DIR }}
                  releaseId: ${{ needs.prepare.outputs.release-id }}
                  tagName: ${{ env.TAG }}
                  releaseDraft: true
                  args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
                  # The action calls macOS "darwin"; keep our stable macos names.
                  releaseAssetNamePattern: ${{ runner.os == 'macOS' && 'Lyra-macos-[arch][setup][ext]' || 'Lyra-[platform]-[arch][setup][ext]' }}
                  uploadUpdaterJson: true
                  updaterJsonPreferNsis: true

            # Empty APPLE_CERTIFICATE variables still trigger Tauri's certificate
            # import, so the unsigned action must omit them entirely.
            - name: Build unsigned macOS and upload
              if: runner.os == 'macOS' && steps.macos-signing.outputs.unsigned == 'true'
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: "-"
              with:
                  projectPath: ${{ env.APP_DIR }}
                  releaseId: ${{ needs.prepare.outputs.release-id }}
                  tagName: ${{ env.TAG }}
                  releaseDraft: true
                  args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
                  releaseAssetNamePattern: Lyra-macos-[arch]-unsigned[setup][ext]
                  uploadUpdaterJson: true

    publish:
        name: Publish release
        needs: [prepare, build]
        if: github.event_name == 'push' || inputs.publish
        runs-on: ubuntu-latest
        steps:
            # The website links to these names under releases/latest/download.
            - name: Check the expected files were uploaded
              id: assets
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release-id }}" --jq '.assets[].name')
                  missing=""
                  macos_asset=Lyra-macos-universal.dmg
                  macos_unsigned=false
                  if grep -qxF Lyra-macos-universal-unsigned.dmg <<< "$assets"; then
                      if [[ "$TAG" != *-* ]]; then
                          echo "::error::A stable release cannot contain an unsigned macOS build."
                          exit 1
                      fi
                      macos_asset=Lyra-macos-universal-unsigned.dmg
                      macos_unsigned=true
                  fi
                  macos_update="${macos_asset%.dmg}.app.tar.gz"
                  for name in latest.json "$macos_asset" "$macos_update" "$macos_update.sig" \
                      Lyra-windows-x64-setup.exe Lyra-windows-x64-setup.exe.sig \
                      Lyra-linux-amd64.AppImage.sig \
                      Lyra-linux-amd64.AppImage Lyra-linux-amd64.deb; do
                      grep -qxF "$name" <<< "$assets" || missing="$missing $name"
                  done
                  if [ -n "$missing" ]; then
                      echo "::error::Missing release files:$missing. Found: $(tr '\n' ' ' <<< "$assets")"
                      exit 1
                  fi
                  echo "macos_unsigned=$macos_unsigned" >> "$GITHUB_OUTPUT"

            - name: Label the unsigned macOS prerelease
              if: steps.assets.outputs.macos_unsigned == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  endpoint="repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release-id }}"
                  body=$(gh api "$endpoint" --jq '.body // ""')
                  notice='**Unsigned macOS beta:** Download Lyra-macos-universal-unsigned.dmg. This build is ad-hoc signed, without Apple Developer ID signing or notarization. If macOS blocks it after moving Lyra to Applications and trying to open it, use System Settings → Privacy & Security → Open Anyway. Update bundles still carry the Lyra updater signature.'
                  if ! grep -qF '**Unsigned macOS beta:**' <<< "$body"; then
                      gh api -X PATCH "$endpoint" -f body="$notice"$'\n\n'"$body" --silent
                  fi

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release-id }}" \
                      -F draft=false --jq '.html_url'
