name: ci

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    APP_DIR: apps/desktop-tauri
    CARGO_TERM_COLOR: always

jobs:
    rust:
        # Each OS compiles its own player adapters (AppleScript and Now
        # Playing, SMTC, MPRIS), so all three are checked.
        name: Rust (${{ matrix.name }})
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macOS
                      platform: macos-latest
                    - name: Windows
                      platform: windows-latest
                    - name: Linux
                      platform: ubuntu-22.04
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      build-essential \
                      libxdo-dev \
                      libssl-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libdbus-1-dev \
                      pkg-config

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Restore Rust cache
              uses: swatinem/rust-cache@v2

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

            # The Tauri bridge embeds the frontend via `generate_context!`, so
            # `frontendDist` (../dist) must exist before the bridge will compile.
            - name: Build frontend (provides dist/ for the bridge)
              working-directory: ${{ env.APP_DIR }}
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Check formatting
              if: runner.os == 'macOS'
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --workspace

    frontend:
        name: Frontend (lint, build)
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

            - name: Install frontend dependencies
              working-directory: ${{ env.APP_DIR }}
              run: pnpm install --frozen-lockfile

            - name: Lint
              working-directory: ${{ env.APP_DIR }}
              run: pnpm run lint

            - name: Type-check and build
              working-directory: ${{ env.APP_DIR }}
              run: pnpm run build

    website:
        name: Website (test, build)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/website
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: apps/website/package-lock.json

            - name: Install dependencies
              run: npm ci

            # The Sites packaging check needs deployment config that is not
            # in the repository.
            - name: Test
              run: node --test --test-skip-pattern="Sites packaging" src/downloads.test.js tests/sites-worker.test.mjs

            # Only the site build; deployment packaging is not part of CI.
            - name: Build
              run: npx vite build
