name: ci

# Pull requests check only the parts they change. A merge to main is not
# checked again: its pull request already ran on the same code. Installers
# are built only for version tags, by release.yml.
on:
    pull_request:
        branches: [main]
        # ready_for_review runs the macOS and Windows checks a draft skipped.
        types: [opened, synchronize, reopened, ready_for_review]
    # Pull requests restore Rust dependencies only from main's cache, so a
    # merge that changes them rebuilds it. Release version bumps do too.
    push:
        branches: [main]
        paths: [Cargo.lock]
    # Run everything on demand.
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

env:
    APP_DIR: apps/desktop-tauri
    CARGO_TERM_COLOR: always

jobs:
    changes:
        name: Detect changes
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            rust: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rust == 'true' }}
            frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
            website: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.website == 'true' }}
            rust-platforms: ${{ steps.platforms.outputs.matrix }}
        steps:
            - name: Match changed files
              id: filter
              if: github.event_name == 'pull_request'
              uses: dorny/paths-filter@v4
              with:
                  predicate-quantifier: some-with-excludes
                  # Workflow and release-script changes run the Rust checks,
                  # which include the release signing policy test.
                  filters: |
                      rust:
                          - 'Cargo.toml'
                          - 'Cargo.lock'
                          - 'crates/**'
                          - 'native/**'
                          - 'apps/desktop-tauri/src-tauri/**'
                          - '.github/workflows/**'
                          - '.github/scripts/**'
                      frontend:
                          - 'apps/desktop-tauri/**'
                          - '!apps/desktop-tauri/src-tauri/**'
                          - '.github/workflows/ci.yml'
                      website:
                          - 'apps/website/**'
                          - '.github/workflows/ci.yml'

            # Draft pull requests check Rust on Linux only. macOS and Windows
            # compile their own player adapters, so they run once the pull
            # request is ready for review, and before every release.
            - name: Choose Rust platforms
              id: platforms
              env:
                  DRAFT: ${{ github.event.pull_request.draft }}
              run: |
                  linux='{"name":"Linux","platform":"ubuntu-22.04"}'
                  if [ "$DRAFT" = "true" ]; then
                      echo "matrix=[$linux]" >> "$GITHUB_OUTPUT"
                  else
                      echo "matrix=[{\"name\":\"macOS\",\"platform\":\"macos-latest\"},{\"name\":\"Windows\",\"platform\":\"windows-latest\"},$linux]" >> "$GITHUB_OUTPUT"
                  fi

    rust:
        name: Rust (${{ matrix.name }})
        needs: changes
        if: needs.changes.outputs.rust == 'true'
        runs-on: ${{ matrix.platform }}
        strategy:
            fail-fast: false
            matrix:
                include: ${{ fromJSON(needs.changes.outputs.rust-platforms) }}
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Test release signing policy
              if: runner.os == 'Linux'
              run: python3 .github/scripts/test_release_signing.py

            - name: Install Linux system dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libwebkit2gtk-4.1-dev \
                      build-essential \
                      libxdo-dev \
                      libssl-dev \
                      libayatana-appindicator3-dev \
                      librsvg2-dev \
                      libdbus-1-dev \
                      pkg-config

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Restore Rust cache
              uses: swatinem/rust-cache@v2

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

            # The Tauri bridge embeds the frontend via `generate_context!`, so
            # `frontendDist` (../dist) must exist before the bridge will compile.
            - name: Build frontend (provides dist/ for the bridge)
              working-directory: ${{ env.APP_DIR }}
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            # rustfmt ignores cfg, so Linux checks every platform's files.
            - name: Check formatting
              if: runner.os == 'Linux'
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Run tests
              run: cargo test --workspace

    frontend:
        name: Frontend (lint, build)
        needs: changes
        if: needs.changes.outputs.frontend == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: apps/desktop-tauri/pnpm-lock.yaml

            - name: Install frontend dependencies
              working-directory: ${{ env.APP_DIR }}
              run: pnpm install --frozen-lockfile

            - name: Lint
              working-directory: ${{ env.APP_DIR }}
              run: pnpm run lint

            - name: Type-check and build
              working-directory: ${{ env.APP_DIR }}
              run: pnpm run build

    website:
        name: Website (lint, test, build)
        needs: changes
        if: needs.changes.outputs.website == 'true'
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/website
        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm
                  cache-dependency-path: apps/website/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm test

            - name: Type-check and build
              run: npm run build

            - name: Worker tests
              run: npm run test:sites
