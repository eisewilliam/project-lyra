name: Bug report
description: Report a problem with Lyra
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please do not report security
        issues here — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "e.g. macOS 15.5 (Apple Silicon) / Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: lyra-version
    attributes:
      label: Lyra version / commit
      placeholder: "e.g. v0.1.0 or commit hash"
    validations:
      required: true
  - type: input
    id: spotify-version
    attributes:
      label: Spotify desktop app version
      placeholder: "e.g. 1.2.x"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste any relevant log output or attach screenshots.
    validations:
      required: false
