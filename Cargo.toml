[workspace]
resolver = "2"
members = [
    "crates/lyra-core",
    "apps/desktop-tauri/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Olusegun William Eise"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json"] }
lru = "0.12"
urlencoding = "2"
