<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lyra settings design reference</title>
    <link rel="stylesheet" href="reference.css">
  </head>
  <body>
    <div class="window" id="window">
      <div class="ambient" aria-hidden="true"><img src="assets/cover.jpg" alt=""></div>
      <aside class="sidebar">
        <div class="brand"><img src="assets/lyra-wordmark.svg" alt="Lyra"></div>
        <nav aria-label="Settings sections" id="navigation"></nav>
      </aside>
      <main class="pane">
        <header class="pane-header"><h1 id="page-title"></h1></header>
        <div id="pinned-preview" class="pinned-preview"></div>
        <div class="pane-body" id="pane-body"></div>
        <footer>Changes apply immediately.</footer>
      </main>
    </div>
    <script src="reference.js"></script>
  </body>
</html>
