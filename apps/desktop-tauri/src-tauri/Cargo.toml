[package]
name = "lyra-desktop"
# The app version (tauri.conf.json has none) is the workspace version.
version.workspace = true
description = "Lyra — floating synced-lyrics companion"
authors = ["Olusegun William Eise"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-autostart = "2"
lyra-core = { path = "../../../crates/lyra-core" }
dirs-next = "2"
tokio = { workspace = true }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSGeometry", "NSNotification", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAccessibility", "NSAppearance", "NSEvent", "NSResponder", "NSScreen", "NSTrackingArea", "NSView", "NSWindow", "NSWorkspace"] }
libc = "0.2"
dispatch2 = { version = "0.3", default-features = false, features = ["std", "libc"] }
window-vibrancy = "0.8.1"
