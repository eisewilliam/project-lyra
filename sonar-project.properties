# ──────────────────────────────────────────────────────────────
# Lyra — SonarQube Configuration (local instance)
# ──────────────────────────────────────────────────────────────

sonar.projectKey=lyra
sonar.projectName=Lyra
sonar.projectVersion=0.1.0

sonar.sourceEncoding=UTF-8

# ── Source paths ─────────────────────────────────────────────
# TypeScript/React frontend + Rust sources (lyra-core & Tauri bridge)
sonar.sources=apps/desktop-tauri/src, \
              crates/lyra-core/src, \
              apps/desktop-tauri/src-tauri/src

# ── Test paths ───────────────────────────────────────────────
# Rust inline #[cfg(test)] modules are detected automatically.
# Add explicit test directories here if you create dedicated test folders.
# sonar.tests=

# ── Exclusions ───────────────────────────────────────────────
# Build artifacts, dependencies, generated code, lock files
sonar.exclusions=**/node_modules/**, \
                 **/target/**, \
                 **/dist/**, \
                 **/gen/**, \
                 **/*.lock, \
                 **/pnpm-lock.yaml, \
                 **/package-lock.json, \
                 **/licenses.html, \
                 **/*.DS_Store

# ── TypeScript / JavaScript ─────────────────────────────────
sonar.typescript.tsconfigPaths=apps/desktop-tauri/tsconfig.app.json

# ── Rust ─────────────────────────────────────────────────────
# SonarQube natively analyses Rust via Clippy (since April 2025).
# Ensure `cargo` and `clippy` are on $PATH when running the scanner.
# To import a pre-generated Clippy report instead of running it live:
# sonar.rust.clippy.reportPaths=clippy-report.json
# sonar.rust.clippy.enabled=false

# ── Coverage (optional) ─────────────────────────────────────
# Generate LCOV with `cargo llvm-cov --lcov --output-path lcov.info`
# then uncomment the line below.
# sonar.coverageReportPaths=lcov.info

# ── Duplicate detection ─────────────────────────────────────
sonar.cpd.exclusions=**/*.lock, **/package-lock.json, **/pnpm-lock.yaml
